[project]
name = "llm-first-loop"
version = "0.6.8"
description = "LLM-First Core Loop: 消息进 → 理解 → 行动 → 真诚回答 → 记住"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "trafilatura>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pypdf>=4.0",
    "websockets>=14.0",
    "lark-oapi>=1.7.2",
    "zstandard>=0.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.6", # R9-WF-02: 全量并行压缩（--dist loadfile；门禁不降级，仅提速）
    "ruff>=0.15",
    "pyright>=1.1.390",
    "Pillow>=10.0",
    "reportlab>=4.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
include = ["src"]

reportMissingImports = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib -m \"not real_llm\""
# 修复（2026-08-29）: .venv 的 __editable__.pth 指向主区 src，pytest 无 PYTHONPATH
# 时实际测主区代码（6 collection errors + 3 假 FAIL 根源）。pythonpath 相对
# rootdir 解析——镜像测镜像、主区测主区，双侧一致。
pythonpath = ["src"]
markers = [
    "real_llm: 真实 LLM 冒烟测试（需真实 key + 网络，默认不随全量运行）",
    "tier0: R9-WF-01 本地冒烟集（六门/开关锚点 + wire 契约 + core 回路冒烟；分钟级反馈，提交门禁仍全量——门禁不降级）",
    "serial: 顺序敏感测试（load_env_file 等进程级污染面；xdist --dist loadgroup 单 worker 收拢）",
]