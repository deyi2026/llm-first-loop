name: privacy-scan
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  privacy-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure base ref available
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # merge-base 回退依赖远端跟踪引用：显式确保其存在。
          # 否则每次 push 都会退化为 --commit 全历史扫描 → 重新引入本改动要消除的确定性红灯。
          # 独立审查 2026-10-30 P2-4
          if [ -n "${DEFAULT_BRANCH:-}" ]; then
            git fetch --no-tags --prune origin \
              "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}" || true
          fi
      - name: Determine scan range
        id: range
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # 全部经 env 间接引用，不在 run: 脚本里写表达式插值记号——GitHub 的 workflow
          # 解析器会校验文件内所有表达式记号出现处（含 run 块注释），空记号即
          # Invalid workflow file（2026-10-30 05:19Z 起每次 push 0s 失败的实测根因）。
          # （独立审查 2026-10-30 P2-4）
          ZERO=0000000000000000000000000000000000000000
          BASE_REF="refs/remotes/origin/${DEFAULT_BRANCH:-main}"
          if [ -n "${BEFORE:-}" ] && [ "${BEFORE}" != "${ZERO}" ] \
             && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "mode=--range" >> "$GITHUB_OUTPUT"
            echo "base=${BEFORE}" >> "$GITHUB_OUTPUT"
          elif git rev-parse --verify --quiet "${BASE_REF}" >/dev/null 2>&1 \
               && BASE="$(git merge-base "${BASE_REF}" "${SHA}" 2>/dev/null)"; then
            # before 不可解析（新分支 push / before 全零 / PR 事件）：以与 main 的 merge-base
            # 为基线，只扫本次新增的提交（--range 只扫范围内变更的 blob，不扫既有历史）。
            # 旧实现此处降级为 --commit 全历史扫描 → 历史遗留 blob 使 CI 在每次例行 push
            # 上确定性红灯（独立审查 2026-10-30 P1-2）。遗留历史属既有事实，不是本次
            # 推送引入；其处置由 push 准入流程单独裁决，不在 CI 上重复阻断。
            echo "mode=--range" >> "$GITHUB_OUTPUT"
            echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          else
            # 空仓库首次推送或 base ref 不可用：无基线可比 → 扫该提交可达的完整历史
            # （防退化为空 diff 空过）
            echo "mode=--commit" >> "$GITHUB_OUTPUT"
            echo "base=" >> "$GITHUB_OUTPUT"
          fi
      - name: Privacy/security scan
        env:
          MODE: ${{ steps.range.outputs.mode }}
          BASE: ${{ steps.range.outputs.base }}
          SHA: ${{ github.sha }}
        run: |
          if [ "${MODE}" = "--range" ]; then
            bash scripts/git_security_scan.sh --range "${BASE}" "${SHA}"
          else
            bash scripts/git_security_scan.sh --commit "${SHA}"
          fi
