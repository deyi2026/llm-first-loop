name: privacy-scan
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  privacy-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine scan range
        id: range
        run: |
          if git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            echo "mode=--range" >> "$GITHUB_OUTPUT"
            echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          else
            # 初始 push / before 全零 / 不可解析：扫该提交可达的完整历史（防退化为空 diff 空过且防中间提交泄露）
            echo "mode=--commit" >> "$GITHUB_OUTPUT"
            echo "base=" >> "$GITHUB_OUTPUT"
          fi
      - name: Privacy/security scan
        run: bash scripts/git_security_scan.sh "${{ steps.range.outputs.mode }}" ${{ steps.range.outputs.base }} "$GITHUB_SHA"
