# T7(2026-08-14): CI 三件套门禁 + nightly 真实评测
#
# - push/PR: pytest（非 real_llm）+ ruff + pyright 全量门禁
# - 每日 20:00 UTC（北京 04:00）: real_llm 冒烟 + 评测集真实运行（需仓库 secrets）
# - workflow_dispatch 可手动触发 nightly（含真实 LLM 消费，注意配额）

name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

jobs:
  test:
    name: 门禁（pytest + ruff + pyright）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: ruff
        run: ruff check src tests scripts
      - name: pyright
        run: pyright src --pythonpath python
      - name: pytest（非真实 LLM）
        run: python -m pytest tests/ -q -m "not real_llm"

  nightly-real:
    name: nightly 真实 LLM 冒烟 + 评测集
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: 无 key 时跳过（不误报）
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ] && [ -z "$LLM_API_KEY" ]; then
            echo "未配置 LLM API key（仓库 secrets），跳过 nightly 真实评测"
            exit 0
          fi
      - name: 运行时诊断（LLM 环境）
        run: |
          python - <<'EOF'
          import os
          print("DEEPSEEK_API_KEY set:", bool(os.environ.get("DEEPSEEK_API_KEY")))
          print("DEEPSEEK_API_KEY len:", len(os.environ.get("DEEPSEEK_API_KEY", "")))
          print("DEEPSEEK_API_KEY head:", repr(os.environ.get("DEEPSEEK_API_KEY", "")[:6]))
          print("LLM_API_KEY set:", bool(os.environ.get("LLM_API_KEY")))
          print("LLM_BASE_URL:", repr(os.environ.get("LLM_BASE_URL")))
          print("LLM_MODEL:", repr(os.environ.get("LLM_MODEL")))
          from llm_loop.config import Settings
          s = Settings(
              llm_api_key=os.environ.get("DEEPSEEK_API_KEY") or os.environ.get("LLM_API_KEY", ""),
              llm_base_url=os.environ.get("LLM_BASE_URL", "https://api.deepseek.com/v1"),
              llm_model=os.environ.get("LLM_MODEL", "deepseek-v4-flash"),
              data_dir="/tmp/eval_data",
              max_iterations=10,
              tool_timeout_s=30.0,
          )
          print("settings.llm_base_url:", repr(s.llm_base_url))
          print("settings.llm_model:", repr(s.llm_model))
          from llm_loop.factory import build_engine
          engine = build_engine(s)
          print("engine.llm.base_url:", repr(engine.llm.base_url))
          print("engine.llm.model:", repr(engine.llm.model))
          EOF
      - name: real_llm 冒烟
        run: python -m pytest tests/integration/test_real_llm_smoke.py tests/integration/test_real_llm_exec_smoke.py -m real_llm -q
      - name: 评测集真实运行（指标落盘）
        run: python scripts/run_eval.py --output docs/metrics/eval_ci
