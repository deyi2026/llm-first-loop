# T7(2026-08-14): CI 三件套门禁 + nightly 真实评测
#
# - push/PR: pytest（非 real_llm）+ ruff/pyright 历史债 ratchet 门禁（2026-10-08 与本地 ci_gate 统一口径；零触网零 LLM 消费）
# - 每日 20:00 UTC（北京 04:00）: real_llm 冒烟 + 评测集真实运行
# - key 策略（2026-08-14 用户决策 A）: 默认不配置 secrets——nightly 无 key 时自动跳过
#   （不误报）；评测集在本地运行（`python scripts/run_eval.py`，读项目 .env，key 不上传）。
#   如需 CI 自动化评测，自行配置 DEEPSEEK_API_KEY secret（注意配额消耗与平台信任权衡）。
# - workflow_dispatch 可手动触发 nightly（含真实 LLM 消费，注意配额）

name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

jobs:
  security-scan:
    name: 安全扫描（敏感/私密/错误文件拦截）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 全树安全扫描（data/.env/密钥/绝对路径/大文件）
        run: bash scripts/git_security_scan.sh --tree

  test:
    name: 门禁（pytest + ruff + pyright）
    runs-on: ubuntu-latest
    steps:
      # Full history: the peer-scorecard contract tests pin exact subject
      # commits (e.g. 832b4dfaa) that are ancestors of PR heads but absent
      # from a depth-1 checkout. Same shallow-clone ambiguity already
      # documented in architecture-review.yml.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
      - name: 安装依赖（uv.lock 冻结环境，与本地 ci_gate 同一面）
        run: uv sync --frozen --extra dev
      - name: ruff
        run: uv run --no-sync python scripts/check_static_diagnostics.py --tool ruff
      - name: pyright
        run: uv run --no-sync python scripts/check_static_diagnostics.py --tool pyright
      - name: pytest（非真实 LLM）
        run: uv run --no-sync python -m pytest tests/ -q -m "not real_llm and not serial_signal"

  linux-installer:
    name: Linux 用户级安装/卸载真实成品验收（${{ matrix.arch }} / glibc）
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 核验 Linux 原生 CPU 架构与 glibc
        run: |
          test "$(uname -s)" = Linux
          test "$(uname -m)" = "${{ matrix.arch }}"
          getconf GNU_LIBC_VERSION | grep -q '^glibc '
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: 构建绑定当前源码的 Web UI
        working-directory: webui
        run: npm ci --ignore-scripts && npm run build
      - name: 构建真实 wheel
        run: uv build --out-dir dist
      - name: 真实 Linux 用户级安装、重复安装、错误摘要拒绝与卸载保留数据
        run: python scripts/verify_linux_installer.py --wheel dist/*.whl --report dist/linux-installer-smoke.json
      - name: 保存 Linux 安装验收报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-installer-smoke-${{ matrix.arch }}
          path: dist/linux-installer-smoke.json
          if-no-files-found: ignore
          retention-days: 14

  nightly-real:
    name: nightly 真实 LLM 冒烟 + 评测集
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: 无 key 时跳过（不误报）
        id: keycheck
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ] && [ -z "$LLM_API_KEY" ]; then
            echo "未配置 LLM API key（仓库 secrets），跳过 nightly 真实评测"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: real_llm 冒烟
        if: steps.keycheck.outputs.skip != 'true'
        run: python -m pytest tests/integration/test_real_llm_smoke.py tests/integration/test_real_llm_exec_smoke.py -m real_llm -q
      - name: 评测集真实运行（指标落盘）
        if: steps.keycheck.outputs.skip != 'true'
        run: python scripts/run_eval.py --output docs/metrics/eval_ci

  serial-signal-stress:
    name: nightly 信号类测试 50 次稳定性
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # D3（2026-10-20）: 信号类测试（serial_signal marker）物理发信号、时序敏感，
      # 门禁并行跑已排除；本 job 顺序连跑 50 次验证稳定性。步骤结构与 test 门禁一致。
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
      - name: 安装依赖（uv.lock 冻结环境，与门禁同一面）
        run: uv sync --frozen --extra dev
      - name: 信号类测试连续 50 次
        run: bash scripts/verify_serial_signal_stability.sh --runs 50

  ambient-env-gate:
    name: 部署 env 泄漏门禁（D4）
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # D4（2026-10-20）: LFL web/execute_command 派生 shell 继承部署绑定
      # LFL_WORKSPACE_ROOT；本 job 在 ambient 泄漏注入下跑泄漏敏感切片——
      # subprocess 免疫测试主导（显式构造 env，不依赖本 job 注入），并验证
      # conftest 批次5 剥离对进程内测试的保护面。步骤结构与门禁同一面。
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --extra dev
      - name: 注入 ambient 部署变量并跑泄漏敏感切片
        run: |
          set -euo pipefail
          VARS=$(uv run --no-sync python -c "from tests.conftest import _DEPLOYED_WORKSPACE_IDENTITY_VARS as v; print(' '.join(v))")
          echo "ambient vars under gate: $VARS"
          for var in $VARS; do export "${var}=ci-ambient-leak-stub"; done
          uv run --no-sync python -m pytest tests/unit/test_ambient_leak_immunity.py tests/unit/test_workspace_resolution.py tests/unit/test_terminal_cli.py tests/unit/test_runtime_identity_enforce.py tests/unit/test_runtime_manifest.py tests/unit/test_runtime_config_p0.py -q -m "not real_llm and not serial_signal"
