<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/ui/v2/favicon.svg" />
    <title>LLM-First Loop · Web V2</title>
    <script>
      // 主题预载（对齐 DSH：data-ds-dark-theme 属性 + prefers-color-scheme 跟随系统）
      (() => {
        const saved = localStorage.getItem("dsw-theme-preference");
        const preference = saved || "system";
        const systemDark =
          preference === "system" &&
          typeof matchMedia !== "undefined" &&
          matchMedia("(prefers-color-scheme: dark)").matches;
        const dark = preference === "dark" || systemDark;
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        document.body.toggleAttribute("data-ds-dark-theme", dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
